[package]
name = "rapidxcloud-crypto-wasm"
version = "2.0.0"
edition = "2021"
authors = ["RapidXCloud Cryptography Team"]
description = "WebAssembly bindings for RapidxCloud shared cryptographic core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rapidxcloud-crypto-core = { path = "../core" }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }
