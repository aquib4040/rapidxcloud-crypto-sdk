[package]
name = "rapidxcloud-crypto-android"
version = "2.0.0"
edition = "2021"
authors = ["RapidXCloud Cryptography Team"]
description = "Android JNI and C-FFI native bridge for RapidxCloud shared cryptographic core"

[lib]
name = "rapidxcloud_crypto"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
rapidxcloud-crypto-core = { path = "../core" }
jni = { version = "0.21", default-features = false }
grammers-tl-types = "0.12.0"
zeroize = "1"
